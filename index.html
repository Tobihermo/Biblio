<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de elementos</title>
</head>
<body>
    <h1>Agregar un nuevo ítem a la lista</h1>
    
    <!-- Formulario para agregar un nuevo item -->
    <form method="POST">
        <label for="item">Nuevo ítem:</label>
        <input type="text" id="item" name="item" required>
        <button type="submit">Agregar</button>
    </form>
    
    <h2>Lista de ítems:</h2>
    <ul>
        {% for item in lista %}
            <li>{{ item }}</li>
        {% endfor %}
    </ul>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
</head>
<body>
    <!--Titulo biblioteca-->
    <div class="container mt-4">
        <h1 class="text-center">Biblioteca</h1>
        <p class="text-center">Busca libros disponibles en nuestra colección:</p>

        <!--Buscador libros guardados-->
        <form action="/buscar" method="GET" class="d-flex justify-content-center">
            <input type="text" name="query" class="form-control w-50" placeholder="Buscar por título, autor o categoría">
            <button type="submit" class="btn btn-primary ms-2">Buscar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

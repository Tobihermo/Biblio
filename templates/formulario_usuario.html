{% extends "base.html" %}

{% block content %}
    <h2>{% if usuario %}Editar{% else %}Agregar{% endif %} Usuario</h2>
    <form action="{{ url_for('guardar_usuario', id_usuario=usuario.id_usuario if usuario else '') }}" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" value="{{ usuario.nombre if usuario else '' }}">

        <label for="tipo">Tipo</label>
        <select name="tipo">
            <option value="estudiante" {% if usuario and usuario.tipo == 'estudiante' %}selected{% endif %}>Estudiante</option>
            <option value="profesor" {% if usuario and usuario.tipo == 'profesor' %}selected{% endif %}>Profesor</option>
        </select>

        <button type="submit">Guardar</button>
    </form>
{% endblock %}

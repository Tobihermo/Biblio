{% extends "base.html" %}

{% block content %}
    <h2>{% if libro %}Editar{% else %}Agregar{% endif %} Libro</h2>
    <form action="{{ url_for('guardar_libro', id_libro=libro.id_libro if libro else '') }}" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" value="{{ libro.nombre if libro else '' }}">

        <label for="autor">Autor</label>
        <input type="text" name="autor" value="{{ libro.autor if libro else '' }}">

        <label for="estado">Estado</label>
        <select name="estado">
            <option value="disponible" {% if libro and libro.estado == 'disponible' %}selected{% endif %}>Disponible</option>
            <option value="prestado" {% if libro and libro.estado == 'prestado' %}selected{% endif %}>Prestado</option>
        </select>

        <button type="submit">Guardar</button>
    </form>
{% endblock %}

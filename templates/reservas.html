<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Libros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <style>
        .btn-custom {
            background-color: #bee3ef;
            color: #064710;
            font-family: 'Times New Roman', serif;
            font-size: 1.25rem;
            width: 8cm;
            border-radius: 50px;
            padding: 0.75rem;
            text-align: center;
            display: inline-block;
            transition: all 0.3s ease;
            text-decoration: none;
        }
    
        .btn-custom:hover {
            background-color: #064710;
            color: white;
        }
    </style>
    
</head>
<body style="background-color: #f4f3ed;">
    <div class="w-100 text-center py-1 position-fixed top-0 start-0" style="background-color: #bee3ef; z-index: 1000; width: 100%; margin: 0;">
        <span style="color: #064710; font-family: 'Times New Roman', serif; font-size: 0.9rem; font-weight: normal;">
            Reservas de Libros Exclusivos
        </span>
    </div>
    
    <div class="text-center mt-5">
        <img src="{{ url_for('static', filename='images/reservas.png') }}" class="img-fluid" alt="Biblioteca" width="300" margin-top: 20px;>


        <div class="p-4" style="background-color: #f4f3ed; box-shadow: 0 4px 8px rgba(100, 100, 100, 0.2); width: 80%; max-width: 800px; margin: auto; font-family: 'Times New Roman', serif; border-radius: 15px;">
            <form action="{{ url_for('reservar') }}" method="POST">
                <div class="mb-3 text-start">
                    <label for="id_libro" class="form-label fw-bold">Selecciona un libro:</label>
                    <select name="id_libro" id="id_libro" class="form-select">
                        {% for libro in libros %}
                            <option value="{{ libro.id_libro }}">{{ libro.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
        
                <div class="mb-3 text-start">
                    <label for="id_usuario" class="form-label fw-bold">Selecciona un usuario:</label>
                    <select name="id_usuario" id="id_usuario" class="form-select">
                        {% for usuario in usuarios %}
                            <option value="{{ usuario.id_usuario }}">{{ usuario.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
        
                <button type="submit" class="btn w-100" style="background-color: #064710; color: #fff; border: none; transition: all 0.3s ease;" 
                    onmouseover="this.style.backgroundColor='#bee3ef'; this.style.color='#064710';" 
                    onmouseout="this.style.backgroundColor='#064710'; this.style.color='#fff';">
                    Reservar
                </button>
            </form>
        </div>                                           

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert 
                        {% if category == 'success' %}alert-success{% endif %}
                        {% if category == 'danger' %}alert-danger{% endif %}
                        text-center mt-3">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}


        <div class="text-center mt-5 mb-4" style="margin-bottom: 70px;">
            <a href="{{ url_for('index') }}" class="btn-custom">Volver al inicio</a>
        </div>                      
    </div>

    <!-- Icono historial -->
    <a href="{{ url_for('historial') }}" class="position-fixed top-0 start-0 p-3" style="margin-left: 10px; margin-top: 20px;">
        <img src="{{ url_for('static', filename='images/historialimg.png') }}" alt="Guardar" width="100" height="100">
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

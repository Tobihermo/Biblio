<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Libros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="text-center mb-4">Reservar Libros</h1>

        <div class="card shadow p-4">
            <form action="{{ url_for('reservar') }}" method="POST">
                <div class="mb-3">
                    <label for="id_libro" class="form-label fw-bold">Selecciona un libro:</label>
                    <select name="id_libro" id="id_libro" class="form-select">
                        {% for libro in libros %}
                            <option value="{{ libro.id_libro }}">{{ libro.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="id_usuario" class="form-label fw-bold">Selecciona un usuario:</label>
                    <select name="id_usuario" id="id_usuario" class="form-select">
                        {% for usuario in usuarios %}
                            <option value="{{ usuario.id_usuario }}">{{ usuario.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Reservar</button>
            </form>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info text-center mt-3">
                    {% for message in messages %}
                        {{ message }}<br>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <h2 class="text-center mt-5">Devolver Libros</h2>

        <div class="card shadow p-4 mt-3">
            <form action="{{ url_for('reservar') }}" method="POST">
                <div class="mb-3">
                    <label for="id_reserva" class="form-label fw-bold">Ingrese el ID de la Reserva:</label>
                    <input type="text" name="id_reserva" id="id_reserva" class="form-control">
                </div>

                <button type="submit" name="devolver" class="btn btn-danger w-100">Devolver</button>
            </form>
        </div>

        <div class="text-center mt-5 mb-4">
            <a href="{{ url_for('index') }}" class="btn btn-dark px-4 py-2 fw-bold rounded-pill">
                Volver al inicio
            </a>
        </div>               
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
